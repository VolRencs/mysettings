# =====================================================================
# modprobe blacklist — под HUANANZHI X99-8M-F / Xeon E5-2660 v3
# C220/B85, NVIDIA TU116 (nvidia-open), USB-аудио C-Media, 2x SATA SSD, desktop
# =====================================================================

# --- Watchdog (в cmdline также nowatchdog) ---
blacklist iTCO_wdt
blacklist wdat_wdt            # резерв: WDAT-устройства в ACPI у вас нет

# --- EDAC: на потребительских X99 часто шумит ошибками ---
blacklist sb_edac

# --- NVIDIA: служебное, не используется ---
blacklist i2c_nvidia_gpu      # i2c-шина GPU
blacklist ucsi_ccg            # NVIDIA USB-C UCSI
blacklist mxm_wmi             # MXM только для ноутбучных GPU
# nouveau уже blacklisted пакетом nvidia-utils — не дублируем

# --- Звук: используется только USB (C-Media) ---
blacklist snd_hda_intel
blacklist snd_seq
blacklist snd_seq_dummy
blacklist snd_hrtimer

# --- Ввод/легаси: клавиатура и мышь — USB ---
blacklist joydev
blacklist mousedev
blacklist mac_hid
blacklist pcspkr
blacklist psmouse             # PS/2-мыши нет
blacklist serio_raw
# ВНИМАНИЕ: atkbd встроен в ядро (builtin) — blacklist на него не действует

# --- Виртуализация не используется ---
blacklist kvm_intel
blacklist kvm

# --- Нет FDD и LPT на плате ---
blacklist floppy
blacklist parport
blacklist parport_pc
blacklist lp
blacklist ppdev

# --- SPI/mtd: BIOS-флеш (/dev/mtd0 intel-spi, /dev/mtd1 BIOS) не используется ---
blacklist spi_intel
blacklist spi_intel_platform
blacklist spi_nor

# --- Прочее, чего на плате нет ---
blacklist gpio_ich
